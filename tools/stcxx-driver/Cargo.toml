[package]
name = "stcxx"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Native Arduino STC MCS251 compiler driver"

[dependencies]
stcxx-driver = { path = "../../../stcxx/compiler", version = "0.3.0" }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
