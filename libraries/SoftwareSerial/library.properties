sentence=Polling software serial for C and C++ arduino-mcs251 sketches.
paragraph=Provides one active two-pin software UART with synchronous transmit and poll-on-read receive for low-rate, idle-gapped traffic. There is no interrupt/background receive, so sketches must call available, peek, read, readBytes, or poll frequently. The C++ Core profile exposes a Stream-compatible class with explicit last-successful begin/listen ownership; inactive objects cannot operate or close the shared backend. Timing remains experimental.
