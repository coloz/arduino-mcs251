sentence=I2C master and hardware slave with Arduino TwoWire callbacks.
paragraph=Provides a hardware or software master with repeated starts and timeouts, plus an interrupt-driven hardware slave with begin(address), onReceive and onRequest. Hardware pin routes follow the variant; STC32G144K246 also exposes independent Wire1 for IIC2. Default TX/RX buffers contain 32 bytes. Slave callbacks execute in interrupt context; do not use blocking APIs there. WIRE_HAS_SLAVE=1.
