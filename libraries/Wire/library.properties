paragraph=Provides a hardware or software master with repeated starts and timeouts, plus an interrupt-driven hardware slave on SDA=P3.3/SCL=P3.2 with begin(address), onReceive and onRequest. Default TX/RX buffers contain 32 bytes. Slave callbacks execute in interrupt context; do not use blocking APIs there. WIRE_HAS_SLAVE=1.
