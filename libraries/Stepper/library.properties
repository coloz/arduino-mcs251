sentence=Stepper motor control for C and C++ arduino-mcs251 sketches.
paragraph=Generates 2-wire, 4-wire, or five-phase 5-wire stepper control sequences with blocking signed motion, speed control, and coil release. Each C++ Stepper object owns its pins, phase, and speed. GPIO drives logic inputs only and requires an external power driver; acceleration, microstepping, current control, and closed-loop motion are not provided.
