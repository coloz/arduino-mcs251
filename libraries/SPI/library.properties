sentence=SPI master with STC32G hardware support and portable software fallback.
paragraph=Provides an SPI master with hardware support on audited STC32G variants and software fallback with configurable pins, clock, bit order, and modes 0 through 3. The C++ profile exposes Arduino-shaped SPISettings and SPIClass wrappers over the same C HAL. There is no slave mode, DMA, or transfer-complete interrupt; the sketch controls chip select.
