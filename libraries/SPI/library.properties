sentence=SPI hardware master for STC32 and AI8051U with GPIO fallback.
paragraph=Provides SPISettings and SPIClass with checked hardware routes, clock selection, bit order and modes 0 through 3. STC32G144K246 exposes SPI, SPI1 and SPI2 with independent state and shared transaction arbitration. usingHardware reports the active backend; unsupported pins or unverifiable clocks use GPIO. No slave, DMA or completion-callback API; the sketch controls chip select.
