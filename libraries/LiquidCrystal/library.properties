sentence=HD44780-compatible character LCD driver for C and C++ arduino-mcs251 sketches.
paragraph=Drives parallel character LCDs in 4-bit or 8-bit mode with validated pins, display and cursor control, custom characters, text output, public init and custom row offsets. Each C++ LiquidCrystal Print object owns its state. Constructors defer hardware initialization until begin or init after Core startup. Busy-flag reads and dual-enable 40x4 are unsupported.
