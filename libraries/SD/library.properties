sentence=FAT16/FAT32 files, directories and multiple File handles for STC MCS251.
paragraph=Supports SDSC/SDHC over SPI, short 8.3 paths, recursive mkdir, empty-directory rmdir, directory iteration, multiple open files, append and overwrite. File copies share their position; distinct opens have independent positions. One card and one sector cache are shared. Long names, FAT12, exFAT and power-loss atomicity are not supported. Larger programs require sufficient Flash capacity.
